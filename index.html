<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6b1a">
<title>zainorder</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c:#ff6b1a;--c2:#ff9a3d;--bg:#f5f5f7;--t:#1d1d22;--g:#8a8a96}
*{box-sizing:border-box;margin:0;font-family:Cairo,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);padding-bottom:150px}
.w{max-width:720px;margin:auto;padding:0 14px}
.top{background:linear-gradient(180deg,#ffd9bf,var(--bg));padding:16px 14px 6px}
.hi{font-weight:800;font-size:19px}.hi small{display:block;color:var(--g);font-weight:400;font-size:13px}
.sb{background:#fff;border-radius:16px;padding:14px;color:var(--g);margin-top:12px;box-shadow:0 2px 10px #0001}
.chips,.car{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar,.car::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border-radius:16px;padding:10px 18px;font-weight:600;border:2px solid transparent;box-shadow:0 1px 6px #0001}
.chip.on{border-color:var(--c);color:var(--c)}
.car{scroll-snap-type:x mandatory}
.bn{flex:none;width:82%;max-width:420px;height:150px;border-radius:20px;scroll-snap-align:center;color:#fff;background:linear-gradient(135deg,var(--c),#ff3d6e);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn div{position:relative;padding:12px 14px;width:100%;background:linear-gradient(0deg,#000b,transparent)}
.bn b{font-size:18px;display:block}
h2{font-size:20px;font-weight:800;margin:18px 0 10px}
.rc{background:#fff;border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 14px #0001}
.cv{height:160px;position:relative;background:#ddd}
.cv>img:first-child{width:100%;height:100%;object-fit:cover}
.lg{position:absolute;bottom:-22px;left:14px;width:64px;height:64px;border-radius:16px;border:3px solid #fff;object-fit:cover;background:#fff}
.cl{position:absolute;top:10px;right:10px;background:#000a;color:#fff;border-radius:10px;padding:3px 10px;font-size:13px}
.inf{padding:12px 14px 14px}.inf b{font-size:18px}.m{color:var(--g);font-size:14px;margin:4px 0}.inf small{color:var(--g)}
.reo{background:#fff;border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.btn{background:var(--c);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;width:100%}
.btn.s{width:auto;padding:8px 16px}
.ct{display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;border-radius:16px;padding:14px;margin:12px 0;font-weight:700}
.pr{background:#fff;border-radius:18px;padding:10px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px #0001}
.pr img{width:86px;height:86px;border-radius:14px;object-fit:cover;background:#eee;flex:none}
.pr .i{flex:1}.pr small{color:var(--g)}.pc{color:var(--c);font-weight:800}
.off{opacity:.45}
.q{display:flex;align-items:center;gap:10px}
.q button{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:20px}
.q b{min-width:18px;text-align:center}
.hd{height:170px;position:relative;background:#ddd}.hd img{width:100%;height:100%;object-fit:cover}
.bk{position:absolute;top:12px;right:12px;background:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;box-shadow:0 2px 8px #0003}
.rt{background:#fff;border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding:16px 14px 4px}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px #0002;z-index:9}
.nav a{text-align:center;color:var(--g);font-size:12px;text-decoration:none;flex:1}.nav a i{display:block;font-size:22px;font-style:normal}.nav a.on{color:var(--c);font-weight:700}
#cb{position:fixed;left:14px;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;display:none}
#cb button{box-shadow:0 6px 18px #ff6b1a66}
#fl{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,var(--c),var(--c2));color:#fff;padding:8px 14px;display:none;align-items:center;gap:10px;z-index:7;border-radius:18px 18px 0 0;font-weight:700}
#fl .tm{background:#0004;border-radius:10px;padding:4px 10px;font-size:18px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #eee}
.row button{border:0;border-radius:8px;padding:6px 10px;background:#eee;margin-inline-start:4px}
.box{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px}
.bd{background:#fff3;border:0;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="cb"><button class="btn" id="cbb" onclick="go('cart')"></button></div>
<div id="fl"><span>⚡</span><span style="flex:1" id="flt"></span><span class="tm" id="fltm"></span></div>
<div class="nav" id="nav">
 <a href="#" onclick="go('');return false" data-p="home"><i>🏠</i>الرئيسية</a>
 <a href="#search" onclick="go('search');return false" data-p="search"><i>🔍</i>البحث</a>
 <a href="#orders" onclick="go('orders');return false" data-p="orders"><i>🧾</i>طلباتي</a>
 <a href="#cart" onclick="go('cart');return false" data-p="cart"><i>🛒</i>السلة <span id="nc"></span></a>
 <a href="#" id="nct" target="_blank"><i>💬</i>الإدارة</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== ضع إعدادات Firebase الخاصة بك هنا ======
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
const WHATSAPP = "963934845767";
// ===============================================
let auth=null,db=null,err=false;
try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore()}catch(e){console.error(e);err=true}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ph="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23e5e5ea%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E";
const im=u=>`src="${esc(u)||ph}" onerror="this.onerror=null;this.src='${ph}'" loading="lazy"`;
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let R=[],P=[],O=[],cats=[],cart=L('zcart',{}),cat='الكل',q='',prev='';
const setCat=i=>{cat=cats[i];home()};
const saveC=()=>localStorage.setItem('zcart',JSON.stringify(cart));
const cnt=()=>Object.values(cart).reduce((a,i)=>a+i.qty,0);
const tot=()=>Object.values(cart).reduce((a,i)=>a+i.qty*i.price,0);
let cur=location.hash.slice(1);
const go=h=>{prev=cur;cur=h;try{location.hash=h}catch(e){}route()};
$('nct').href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent('مرحباً، أريد التواصل مع إدارة zainorder')}`;

async function load(){
 const g=c=>db.collection(c).get().then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
 [R,P,O]=await Promise.all([g('restaurants'),g('products'),g('offers')]);
}
function add(id,d){
 const p=P.find(x=>x.id===id);if(!p)return;
 const r=R.find(x=>x.id===p.rid);
 const it=cart[id]||{name:p.name,price:+p.price,qty:0,rest:r?r.name:''};
 it.qty+=d;if(it.qty<=0)delete cart[id];else cart[id]=it;
 saveC();route(true);
}
function chrome(p){
 const c=cnt(),adm=p==='admin';
 $('nav').style.display=adm?'none':'flex';
 document.querySelectorAll('.nav a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
 $('nc').textContent=c?`(${c})`:'';
 $('cb').style.display=(c&&p!=='cart'&&!adm)?'block':'none';
 $('cbb').textContent=`🛒 عرض السلة (${c}) — ${tot()} ل.س`;
 const showFl=O.length&&(p==='home'||p==='orders')&&!adm;
 $('fl').style.display=showFl?'flex':'none';
 if(showFl)$('flt').textContent=O[0].title;
 $('cb').style.bottom=`calc(${showFl?118:72}px + env(safe-area-inset-bottom,0px))`;
}
setInterval(()=>{const n=new Date(),e=new Date(n);e.setHours(23,59,59,999);const s=Math.max(0,Math.floor((e-n)/1000));
 $('fltm').textContent=[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')},1000);

function rcard(r){
 const closed=r.open===false;
 return `<div class="rc" onclick="go('r=${r.id}')"><div class="cv"><img ${im(r.img)}>${closed?'<span class="cl">مغلق</span>':''}<img class="lg" ${im(r.logo||r.img)}></div><div class="inf"><b>${esc(r.name)}</b><div class="m">${r.rating?'⭐ '+esc(r.rating)+' &nbsp;':''}${r.time?'⏱ '+esc(r.time)+' د &nbsp;':''}${r.fee?'🛵 '+esc(r.fee)+' ل.س':''}</div><small>${esc(r.desc)}</small></div></div>`;
}
function route(keep){
 const h=cur;
 if(h==='admin')return admin();
 if(h==='cart')return cartPage();
 if(h==='search')return search();
 if(h==='orders')return orders();
 if(h.startsWith('r='))return rest(h.slice(2));
 home();if(!keep)scrollTo(0,0);
}
function home(){
 cats=['الكل',...new Set(R.map(r=>r.cat).filter(Boolean))];if(!cats.includes(cat))cat='الكل';
 const last=L('zhist',[])[0];
 const list=R.filter(r=>cat==='الكل'||r.cat===cat);
 $('app').innerHTML=`<div class="top"><div class="w"><div class="hi">أهلاً بك 👋<small>ماذا تريد أن تطلب اليوم؟</small></div><div class="sb" onclick="go('search')">🔍 ابحث عن مطعم أو وجبة...</div></div></div>
 <div class="chips">${cats.map((c,i)=>`<div class="chip ${c===cat?'on':''}" onclick="setCat(${i})">${esc(c)}</div>`).join('')}</div>
 ${O.length?`<div class="car">${O.map(o=>`<div class="bn" ${o.rid?`onclick="go('r=${o.rid}')"`:''}>${o.img?`<img ${im(o.img)}>`:''}<div><b>${esc(o.title)}</b>${esc(o.text)}</div></div>`).join('')}</div>`:''}
 <div class="w">${last?`<div class="reo"><div><b>اطلب مجدداً 🔁</b><br><small style="color:var(--g)">${last.total} ل.س · ${new Date(last.date).toLocaleDateString('ar')}</small></div><button class="btn s" onclick="reorder(0)">إعادة الطلب</button></div>`:''}
 <h2>🔥 المطاعم</h2>${list.map(rcard).join('')||(err?'<p style="color:#d33">تعذر تحميل البيانات. تأكد من إعدادات Firebase وقواعد Firestore.</p>':'<p style="color:var(--g)">لا توجد مطاعم بعد. أضفها من لوحة التحكم #admin</p>')}</div>`;
 chrome('home');
}
function search(){
 $('app').innerHTML=`<div class="w" style="padding-top:16px"><input id="sq" placeholder="🔍 ابحث عن مطعم أو وجبة" value="${esc(q)}" oninput="q=this.value;sres()"><div id="sr"></div></div>`;
 chrome('search');sres();$('sq').focus();
}
function sres(){
 const t=q.trim().toLowerCase();
 if(!t){$('sr').innerHTML='<p style="color:var(--g);text-align:center;margin-top:30px">اكتب للبحث</p>';return}
 const rs=R.filter(r=>[r.name,r.cat,r.desc].join(' ').toLowerCase().includes(t));
 const ps=P.filter(p=>p.name.toLowerCase().includes(t));
 $('sr').innerHTML=(rs.length?'<h2>المطاعم</h2>'+rs.map(rcard).join(''):'')+(ps.length?'<h2>الوجبات</h2>'+ps.map(p=>{const r=R.find(x=>x.id===p.rid)||{};return `<div class="pr" onclick="go('r=${p.rid}')"><img ${im(p.img)}><div class="i"><b>${esc(p.name)}</b><br><small>${esc(r.name)}</small><br><span class="pc">${esc(p.price)} ل.س</span></div></div>`}).join(''):'')||'<p style="text-align:center">لا نتائج</p>';
}
function rest(id){
 const r=R.find(x=>x.id===id);if(!r)return home();
 const closed=r.open===false,list=P.filter(p=>p.rid===id),secs=[...new Set(list.map(p=>p.sec||'الأصناف'))];
 $('app').innerHTML=`<div class="hd"><img ${im(r.img)}><button class="bk" onclick="go(prev&&prev!==cur?prev:'')">→</button></div>
 <div class="rt"><div class="w" style="padding:0"><h2 style="margin-top:0">${esc(r.name)}</h2><div class="m">${r.rating?'⭐ '+esc(r.rating)+' · ':''}${r.time?'⏱ '+esc(r.time)+' د · ':''}${r.fee?'🛵 '+esc(r.fee)+' ل.س':''}</div><small style="color:var(--g)">${esc(r.desc)}</small>${closed?'<p style="color:#d33;font-weight:700;margin-top:8px">المطعم مغلق حالياً</p>':''}
 ${secs.map(s=>`<h2>${esc(s)}</h2>`+list.filter(p=>(p.sec||'الأصناف')===s).map(p=>{
  const n=cart[p.id]?.qty||0,ok=p.available!==false&&!closed;
  return `<div class="pr ${ok?'':'off'}"><img ${im(p.img)}><div class="i"><b>${esc(p.name)}</b><br><small>${esc(p.desc)}</small><br><span class="pc">${esc(p.price)} ل.س</span></div>`+(!ok?'<small>غير متوفر</small>':n?`<div class="q"><button onclick="add('${p.id}',1)">+</button><b>${n}</b><button onclick="add('${p.id}',-1)">−</button></div>`:`<button class="btn s" onclick="add('${p.id}',1)">+ أضف</button>`)+'</div>'}).join('')).join('')||'<p>لا توجد منتجات.</p>'}</div></div>`;
 chrome('rest');
}
function cartPage(){
 const it=Object.entries(cart),info=L('zinfo',{});
 if(!it.length){$('app').innerHTML='<div class="w" style="padding-top:40px;text-align:center"><h2>🛒 السلة فارغة</h2><button class="btn" onclick="go(\'\')">تصفح المطاعم</button></div>';return chrome('cart')}
 $('app').innerHTML=`<div class="w" style="padding-top:14px"><h2>🛒 سلتك</h2><div class="box">${it.map(([id,i])=>`<div class="row"><span><b>${esc(i.name)}</b><br><small style="color:var(--g)">${esc(i.rest)} · ${i.price} × ${i.qty}</small></span><div class="q"><button onclick="add('${id}',1)">+</button><button onclick="add('${id}',-1)">−</button></div></div>`).join('')}<h2>المجموع: ${tot()} ل.س</h2></div>
 <div class="box"><input id="n" placeholder="الاسم" value="${esc(info.n)}"><input id="t" type="tel" placeholder="رقم الهاتف" value="${esc(info.t)}"><input id="a" placeholder="العنوان بالتفصيل" value="${esc(info.a)}"><textarea id="o" rows="2" placeholder="ملاحظات"></textarea></div>
 <button class="btn" onclick="send()">إرسال الطلب عبر واتساب ✅</button></div>`;
 chrome('cart');
}
function send(){
 const n=$('n').value.trim(),t=$('t').value.trim(),a=$('a').value.trim(),o=$('o').value.trim();
 if(!n||!t||!a)return alert('الرجاء إدخال الاسم والهاتف والعنوان');
 localStorage.setItem('zinfo',JSON.stringify({n,t,a}));
 const by={};Object.values(cart).forEach(i=>(by[i.rest]=by[i.rest]||[]).push(i));
 let m='🛍️ *طلب جديد - zainorder*\n';
 for(const r in by){m+=`\n🍽️ *${r}*\n`;by[r].forEach(i=>m+=`• ${i.name} × ${i.qty} = ${i.qty*i.price}\n`)}
 m+=`\n💰 *المجموع: ${tot()} ل.س*\n\n👤 ${n}\n📞 ${t}\n📍 ${a}`+(o?`\n📝 ${o}`:'');
 const h=L('zhist',[]);h.unshift({date:Date.now(),total:tot(),cart});localStorage.setItem('zhist',JSON.stringify(h.slice(0,20)));
 const wu=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`;
 cart={};saveC();go('orders');
 if(!window.open(wu,'_blank'))location.href=wu;
}
function orders(){
 const h=L('zhist',[]);
 $('app').innerHTML=`<div class="w" style="padding-top:14px"><h2>🧾 طلباتي</h2>`+(h.map((o,i)=>`<div class="box"><b>${new Date(o.date).toLocaleString('ar')}</b><br><small style="color:var(--g)">${Object.values(o.cart).map(x=>esc(x.name)+' ×'+x.qty).join('، ')}</small><div class="row" style="border:0"><b>${o.total} ل.س</b><button class="btn s" onclick="reorder(${i})">إعادة الطلب</button></div></div>`).join('')||'<p style="color:var(--g)">لا توجد طلبات سابقة.</p>')+'</div>';
 chrome('orders');
}
function reorder(i){const o=L('zhist',[])[i];if(!o)return;cart=o.cart;saveC();go('cart')}

// ===== لوحة التحكم =====
const F={
 restaurants:{t:'مطعم',f:[['name','اسم المطعم'],['cat','التصنيف (مطاعم، سوبر ماركت، حلويات...)'],['desc','نوع الأكل (فروج، شاورما)'],['img','رابط صورة الغلاف'],['logo','رابط الشعار'],['time','مدة التوصيل مثل 20-35'],['fee','أجور التوصيل'],['rating','التقييم مثل 4.5']]},
 products:{t:'منتج',f:[['rid','المطعم','sel'],['sec','القسم (وجبات، مشروبات...)'],['name','اسم المنتج'],['price','السعر','number'],['desc','وصف قصير'],['img','رابط الصورة']]},
 offers:{t:'عرض',f:[['title','عنوان العرض'],['text','تفاصيل'],['img','رابط صورة'],['rid','مطعم مرتبط (اختياري)','sel']]}
};
let ed={};
function form(c){
 const d=F[c];
 return `<div class="box"><h2 style="margin-top:0">${ed[c]?'تعديل':'إضافة'} ${d.t}</h2>`+d.f.map(([k,l,ty])=>ty==='sel'?`<select id="f_${c}_${k}"><option value="">${l}</option>${R.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>`:`<input id="f_${c}_${k}" type="${ty||'text'}" placeholder="${l}">`).join('')+`<button class="btn" onclick="sv('${c}')">حفظ</button>${ed[c]?`<button class="btn" style="background:#999;margin-top:6px" onclick="ed['${c}']=null;admin()">إلغاء التعديل</button>`:''}</div>`;
}
function fill(c){const id=ed[c];if(!id)return;const x=({restaurants:R,products:P,offers:O})[c].find(z=>z.id===id)||{};F[c].f.forEach(([k])=>{const e=$(`f_${c}_${k}`);if(e)e.value=x[k]??''})}
function admin(){
 const u=auth.currentUser;
 if(!u){$('app').innerHTML=`<div class="w" style="padding-top:30px"><h2>دخول المالك</h2><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة السر"><button class="btn" onclick="login()">دخول</button><p id="err" style="color:red"></p></div>`;return chrome('admin')}
 $('app').innerHTML=`<div class="w" style="padding-top:14px"><button class="btn s" onclick="go('')">→ الموقع</button> <button class="btn s" style="background:#999" onclick="auth.signOut()">خروج</button>
 ${form('restaurants')}${form('products')}${form('offers')}
 <div class="box"><h2 style="margin-top:0">المطاعم والمنتجات</h2>`+R.map(r=>`<div class="row"><b>${esc(r.name)}</b><span><button onclick="tg('restaurants','${r.id}','open',${r.open!==false})">${r.open!==false?'إغلاق':'فتح'}</button><button onclick="edt('restaurants','${r.id}')">✏️</button><button onclick="del('restaurants','${r.id}')">🗑️</button></span></div>`+P.filter(p=>p.rid===r.id).map(p=>`<div class="row"><span>&nbsp;&nbsp;${esc(p.name)} - ${esc(p.price)}</span><span><button onclick="tg('products','${p.id}','available',${p.available!==false})">${p.available!==false?'إخفاء':'إظهار'}</button><button onclick="edt('products','${p.id}')">✏️</button><button onclick="del('products','${p.id}')">🗑️</button></span></div>`).join('')).join('')+`</div>
 <div class="box"><h2 style="margin-top:0">العروض</h2>${O.map(o=>`<div class="row"><span>${esc(o.title)}</span><span><button onclick="edt('offers','${o.id}')">✏️</button><button onclick="del('offers','${o.id}')">🗑️</button></span></div>`).join('')||'لا يوجد'}</div></div>`;
 Object.keys(F).forEach(fill);chrome('admin');
}
async function login(){try{await auth.signInWithEmailAndPassword($('em').value,$('pw').value)}catch(e){$('err').textContent='بيانات الدخول غير صحيحة'}}
async function sv(c){
 const o={};F[c].f.forEach(([k,,ty])=>{const v=$(`f_${c}_${k}`).value.trim();o[k]=ty==='number'?+v||0:v});
 if(!o[F[c].f.find(x=>x[0]==='name'||x[0]==='title')[0]])return alert('أدخل الاسم/العنوان');
 if(c==='products'&&!o.rid)return alert('اختر المطعم');
 if(ed[c])await db.collection(c).doc(ed[c]).update(o);else{if(c==='products')o.available=true;if(c==='restaurants')o.open=true;await db.collection(c).add(o)}
 ed[c]=null;await load();admin();
}
function edt(c,id){ed[c]=id;admin();scrollTo(0,0)}
async function del(c,id){if(!confirm('تأكيد الحذف؟'))return;if(c==='restaurants')for(const p of P.filter(p=>p.rid===id))await db.collection('products').doc(p.id).delete();await db.collection(c).doc(id).delete();await load();admin()}
async function tg(c,id,k,cur){await db.collection(c).doc(id).update({[k]:!cur});await load();admin()}

window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==cur){prev=cur;cur=h;route()}});
if(auth)auth.onAuthStateChanged(()=>{if(cur==='admin')route(true)});
route();
Promise.race([load(),new Promise((_,j)=>setTimeout(()=>j('timeout'),8000))]).then(()=>{if(cur==='admin'&&[...document.querySelectorAll('#app input,#app select')].some(i=>i.value))return;route(true)}).catch(e=>{console.error(e);err=true;route(true)});
</script>
