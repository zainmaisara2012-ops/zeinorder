<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6b1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="zainorder">
<title>zainorder</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c:#ff6b1a;--c2:#ff9a3d;--bg:#f5f5f7;--t:#1d1d22;--g:#8a8a96}
*{box-sizing:border-box;margin:0;font-family:Cairo,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);padding-bottom:150px}
.w{max-width:720px;margin:auto;padding:0 14px}
.top{background:linear-gradient(180deg,#ffd9bf,var(--bg));padding:16px 14px 6px}
.hi{font-weight:800;font-size:19px}.hi small{display:block;color:var(--g);font-weight:400;font-size:13px}
.sb{background:#fff;border-radius:16px;padding:14px;color:var(--g);margin-top:12px;box-shadow:0 2px 10px #0001}
.chips,.car{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar,.car::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border-radius:16px;padding:10px 18px;font-weight:600;border:2px solid transparent;box-shadow:0 1px 6px #0001}
.chip.on{border-color:var(--c);color:var(--c)}
.car{scroll-snap-type:x mandatory}
.bn{flex:none;width:82%;max-width:420px;height:150px;border-radius:20px;scroll-snap-align:center;color:#fff;background:linear-gradient(135deg,var(--c),#ff3d6e);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn div{position:relative;padding:12px 14px;width:100%;background:linear-gradient(0deg,#000b,transparent)}
.bn b{font-size:18px;display:block}
h2{font-size:20px;font-weight:800;margin:18px 0 10px}
.rc{background:#fff;border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 14px #0001}
.cv{height:160px;position:relative;background:#ddd}
.cv>img:first-child{width:100%;height:100%;object-fit:cover}
.lg{position:absolute;bottom:-22px;left:14px;width:64px;height:64px;border-radius:16px;border:3px solid #fff;object-fit:cover;background:#fff}
.cl{position:absolute;top:10px;right:10px;background:#000a;color:#fff;border-radius:10px;padding:3px 10px;font-size:13px}
.inf{padding:12px 14px 14px}.inf b{font-size:18px}.m{color:var(--g);font-size:14px;margin:4px 0}.inf small{color:var(--g)}
.reo{background:#fff;border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.btn{background:var(--c);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;width:100%}
.btn.s{width:auto;padding:8px 16px}
.ct{display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;border-radius:16px;padding:14px;margin:12px 0;font-weight:700}
.pr{background:#fff;border-radius:18px;padding:10px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px #0001}
.pr img{width:86px;height:86px;border-radius:14px;object-fit:cover;background:#eee;flex:none}
.pr .i{flex:1}.pr small{color:var(--g)}.pc{color:var(--c);font-weight:800}
.off{opacity:.45}
.q{display:flex;align-items:center;gap:8px}
.q button,.row .q button{width:44px;height:44px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:28px;font-weight:800;line-height:1;padding:0;margin:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px #ff6b1a55}
.q button.mn,.row .q button.mn{background:#fff;color:var(--c);border:2.5px solid var(--c);box-shadow:none}
.q b{min-width:28px;text-align:center;font-size:19px}
.hd{height:170px;position:relative;background:#ddd}.hd img{width:100%;height:100%;object-fit:cover}
.q2{background:#25d366;color:#fff;border:0;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.up{display:block;text-align:center;background:#e8f7ee;color:#128c4a;border:2px dashed #25d366;border-radius:12px;padding:10px;margin:5px 0;font-weight:700}
.pay{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #eee;border-radius:12px;margin:6px 0;font-weight:600}
input[type=radio]{width:20px;height:20px;margin:0}
.cats{display:flex;gap:14px;overflow-x:auto;padding:14px 14px 6px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.ct2{flex:none;width:76px;text-align:center}.ct2 .ic{width:76px;height:76px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;border:2.5px solid transparent;box-shadow:0 2px 8px #0001}.ct2 span{display:block;margin-top:6px;font-size:14px;font-weight:600}.ct2.on .ic{border-color:var(--c)}.ct2.on span{color:var(--c)}
.bk{position:absolute;top:12px;right:12px;background:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;box-shadow:0 2px 8px #0003}
.rt{background:#fff;border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding:16px 14px 4px}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px #0002;z-index:9}
.nav a{text-align:center;color:var(--g);font-size:12px;text-decoration:none;flex:1}.nav a i{display:block;font-size:22px;font-style:normal}.nav a.on{color:var(--c);font-weight:700}
#cb{position:fixed;left:14px;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;display:none}
#cb button{box-shadow:0 6px 18px #ff6b1a66}
#fl{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,var(--c),var(--c2));color:#fff;padding:8px 14px;display:none;align-items:center;gap:10px;z-index:7;border-radius:18px 18px 0 0;font-weight:700}
#fl .tm{background:#0004;border-radius:10px;padding:4px 10px;font-size:18px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #eee}
.row button{border:0;border-radius:8px;padding:6px 10px;background:#eee;margin-inline-start:4px}
.box{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px}
.bd{background:#fff3;border:0;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="cb"><button class="btn" id="cbb" onclick="go('cart')"></button></div>
<div id="fl"><span>⚡</span><span style="flex:1" id="flt"></span><span class="tm" id="fltm"></span></div>
<div class="nav" id="nav">
 <a href="#" onclick="go('');return false" data-p="home"><i>🏠</i>الرئيسية</a>
 <a href="#search" onclick="go('search');return false" data-p="search"><i>🔍</i>البحث</a>
 <a href="#orders" onclick="go('orders');return false" data-p="orders"><i>🧾</i>طلباتي</a>
 <a href="#cart" onclick="go('cart');return false" data-p="cart"><i>🛒</i>السلة <span id="nc"></span></a>
 <a href="#" id="nct"><i>💬</i>الإدارة</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
// ====== ضع إعدادات Firebase الخاصة بك هنا ======
const firebaseConfig = {
  apiKey: "AIzaSyD--9VNTvFlQNatb7Hwebo7R4U89HL6wpM",
  authDomain: "zienorder.firebaseapp.com",
  projectId: "zienorder",
  storageBucket: "zienorder.firebasestorage.app",
  messagingSenderId: "413824150655",
  appId: "1:413824150655:web:1f310da38b071f6146a34a"
};
const WHATSAPP = "963934845767";
const VAPID = "PASTE_VAPID_KEY_HERE";
// ===============================================
let auth=null,db=null,err=false;
try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();try{db.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}}catch(e){console.error(e);err=true}
let msg=null;
try{if(firebase.messaging&&firebase.messaging.isSupported())msg=firebase.messaging()}catch(e){console.warn(e)}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ph="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23e5e5ea%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E";
const im=u=>`src="${esc(u)||ph}" onerror="this.onerror=null;this.src='${ph}'" loading="lazy"`;
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let R=[],P=[],O=[],Cp=[],cpOk=false,coupon=L('zcoup',null),draft={},cats=[],cart=L('zcart',{}),cat='الكل',q='',prev='';
const setCat=i=>{cat=cats[i];home()};
function catIcon(c){const m=[[/الكل/,'🛍️'],[/جديد/,'✨'],[/سوبر|ماركت|بقال/,'🛒'],[/حلو|كيك|تورت/,'🍰'],[/مشروب|عصير|مثلج/,'🥤'],[/قهو|مقه|كافي/,'☕'],[/بيتزا/,'🍕'],[/شاورما|ساندويش|سندويش/,'🌯'],[/فروج|دجاج|بروست/,'🍗'],[/برغر|برجر/,'🍔'],[/مخبز|معجنات|فطائر|مناقيش/,'🥐'],[/صيدل|دواء/,'💊'],[/خضار|فواكه/,'🥬'],[/مطعم|مطاعم|أكل|وجبات/,'🍔']];for(const [r,i] of m)if(r.test(c))return i;return '🍽️'}
const saveC=()=>localStorage.setItem('zcart',JSON.stringify(cart));
const cnt=()=>Object.values(cart).reduce((a,i)=>a+i.qty,0);
const tot=()=>Object.values(cart).reduce((a,i)=>a+i.qty*i.price,0);
let cur=location.hash.slice(1);
const go=h=>{prev=cur;cur=h;try{location.hash=h}catch(e){}route()};
$('nct').onclick=e=>{e.preventDefault();showSend([{rest:'إدارة zainorder',num:waNum(WHATSAPP),text:'مرحباً، أريد التواصل مع إدارة zainorder'}],'💬 تواصل مع الإدارة')};

async function load(){
 cpOk=false;
 const g=c=>db.collection(c).get().then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
 [R,P,O]=await Promise.all([g('restaurants'),g('products'),g('offers')]);
}
function add(id,d){
 if(cur==='cart'&&$('n'))saveDraft();
 const p=P.find(x=>x.id===id);if(!p)return;
 const r=R.find(x=>x.id===p.rid);
 const it=cart[id]||{name:p.name,price:+p.price,qty:0,rest:r?r.name:'',rid:p.rid,wa:r?r.wa||'':'',sham:r?r.sham||'':'',fee:+String(r&&r.fee||'').replace(/[^\d.]/g,'')||0};
 it.qty+=d;if(it.qty<=0)delete cart[id];else cart[id]=it;
 saveC();route(true);
}
function chrome(p){
 const c=cnt(),adm=p==='admin';
 $('nav').style.display=(adm||p==='reg')?'none':'flex';
 document.querySelectorAll('.nav a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
 $('nc').textContent=c?`(${c})`:'';
 $('cb').style.display=(c&&p!=='cart'&&!adm&&p!=='reg'&&p!=='profile')?'block':'none';
 $('cbb').textContent=`🛒 عرض السلة (${c}) — ${tot()} ل.س`;
 const showFl=O.length&&(p==='home'||p==='orders')&&!adm;
 $('fl').style.display=showFl?'flex':'none';
 if(showFl)$('flt').textContent=O[0].title;
 $('cb').style.bottom=`calc(${showFl?118:72}px + env(safe-area-inset-bottom,0px))`;
}
setInterval(()=>{const n=new Date(),e=new Date(n);e.setHours(23,59,59,999);const s=Math.max(0,Math.floor((e-n)/1000));
 $('fltm').textContent=[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')},1000);

function rcard(r){
 const closed=r.open===false;
 return `<div class="rc" onclick="go('r=${r.id}')"><div class="cv"><img ${im(r.img)}>${closed?'<span class="cl">مغلق</span>':''}<img class="lg" ${im(r.logo||r.img)}></div><div class="inf"><b>${esc(r.name)}</b><div class="m">${r.rating?'⭐ '+esc(r.rating)+' &nbsp;':''}${r.time?'⏱ '+esc(r.time)+' د &nbsp;':''}${r.fee?'🛵 '+esc(r.fee)+' ل.س':''}</div><small>${esc(r.desc)}</small></div></div>`;
}
function route(keep){
 const h=cur;
 if(h!=='admin'&&!L('zuser',null))return reg(false);
 if(h==='admin')return admin();
 if(h==='profile')return reg(true);
 if(h==='cart')return cartPage();
 if(h==='search')return search();
 if(h==='orders')return orders();
 if(h.startsWith('r='))return rest(h.slice(2));
 home();if(!keep)scrollTo(0,0);
}
function home(){
 cats=['الكل',...new Set(R.map(r=>r.cat).filter(Boolean))];if(!cats.includes(cat))cat='الكل';
 const last=L('zhist',[])[0];
 const list=R.filter(r=>cat==='الكل'||r.cat===cat);
 $('app').innerHTML=`<div class="top"><div class="w"><div class="hi"><span onclick="go('profile')" style="float:left;font-size:26px">👤</span>أهلاً ${esc((L('zuser',{}).n||'').split(' ')[0])} 👋<small>${L('zuser',{}).a?'📍 '+esc(L('zuser',{}).a):'ماذا تريد أن تطلب اليوم؟'}</small></div><div class="sb" onclick="go('search')">🔍 ابحث عن مطعم أو وجبة...</div></div></div>
 <div class="cats">${cats.map((c,i)=>`<div class="ct2 ${c===cat?'on':''}" onclick="setCat(${i})"><div class="ic">${catIcon(c)}</div><span>${esc(c)}</span></div>`).join('')}</div>${notifCard()}
 ${O.length?`<div class="car">${O.map(o=>`<div class="bn" ${o.rid?`onclick="go('r=${o.rid}')"`:''}>${o.img?`<img ${im(o.img)}>`:''}<div><b>${esc(o.title)}</b>${esc(o.text)}</div></div>`).join('')}</div>`:''}
 <div class="w">${last?`<div class="reo"><div><b>اطلب مجدداً 🔁</b><br><small style="color:var(--g)">${last.total} ل.س · ${new Date(last.date).toLocaleDateString('ar')}</small></div><button class="btn s" onclick="reorder(0)">إعادة الطلب</button></div>`:''}
 <h2>🔥 المطاعم</h2>${list.map(rcard).join('')||(err?'<p style="color:#d33">تعذر تحميل البيانات. تأكد من الإنترنت (وأطفئ VPN إن وُجد).</p><button class="btn" onclick="retry()">🔄 إعادة المحاولة</button>':'<p style="color:var(--g)">لا توجد مطاعم بعد. أضفها من لوحة التحكم #admin</p>')}</div>`;
 chrome('home');
}
function search(){
 $('app').innerHTML=`<div class="w" style="padding-top:16px"><input id="sq" placeholder="🔍 ابحث عن مطعم أو وجبة" value="${esc(q)}" oninput="q=this.value;sres()"><div id="sr"></div></div>`;
 chrome('search');sres();$('sq').focus();
}
function sres(){
 const t=q.trim().toLowerCase();
 if(!t){$('sr').innerHTML='<p style="color:var(--g);text-align:center;margin-top:30px">اكتب للبحث</p>';return}
 const rs=R.filter(r=>[r.name,r.cat,r.desc].join(' ').toLowerCase().includes(t));
 const ps=P.filter(p=>p.name.toLowerCase().includes(t));
 $('sr').innerHTML=(rs.length?'<h2>المطاعم</h2>'+rs.map(rcard).join(''):'')+(ps.length?'<h2>الوجبات</h2>'+ps.map(p=>{const r=R.find(x=>x.id===p.rid)||{};return `<div class="pr" onclick="go('r=${p.rid}')"><img ${im(p.img)}><div class="i"><b>${esc(p.name)}</b><br><small>${esc(r.name)}</small><br><span class="pc">${esc(p.price)} ل.س</span></div></div>`}).join(''):'')||'<p style="text-align:center">لا نتائج</p>';
}
function rest(id){
 const r=R.find(x=>x.id===id);if(!r)return home();
 const closed=r.open===false,list=P.filter(p=>p.rid===id),secs=[...new Set(list.map(p=>p.sec||'الأصناف'))];
 $('app').innerHTML=`<div class="hd"><img ${im(r.img)}><button class="bk" onclick="go(prev&&prev!==cur?prev:'')">→</button></div>
 <div class="rt"><div class="w" style="padding:0"><h2 style="margin-top:0">${esc(r.name)}</h2><div class="m">${r.rating?'⭐ '+esc(r.rating)+' · ':''}${r.time?'⏱ '+esc(r.time)+' د · ':''}${r.fee?'🛵 '+esc(r.fee)+' ل.س':''}</div><small style="color:var(--g)">${esc(r.desc)}</small>${closed?'<p style="color:#d33;font-weight:700;margin-top:8px">المطعم مغلق حالياً</p>':''}
 ${secs.map(s=>`<h2>${esc(s)}</h2>`+list.filter(p=>(p.sec||'الأصناف')===s).map(p=>{
  const n=cart[p.id]?.qty||0,ok=p.available!==false&&!closed;
  return `<div class="pr ${ok?'':'off'}"><img ${im(p.img)}><div class="i"><b>${esc(p.name)}</b><br><small>${esc(p.desc)}</small><br><span class="pc">${esc(p.price)} ل.س</span></div>`+'<div style="display:flex;flex-direction:column;gap:6px;align-items:center">'+(!ok?'<small>غير متوفر</small>':n?`<div class="q"><button onclick="add('${p.id}',1)">+</button><b>${n}</b><button class="mn" onclick="add('${p.id}',-1)">−</button></div>`:`<button class="btn s" onclick="add('${p.id}',1)">+ أضف</button>`)+(ok?`<button class="q2" onclick="quick('${p.id}')">💬 اطلب الآن</button>`:'')+'</div>'}).join('')).join('')||'<p>لا توجد منتجات.</p>'}</div></div>`;
 chrome('rest');
}
const feeTotal=()=>{const m={};Object.values(cart).forEach(i=>{m[i.rid||i.rest]=+i.fee||0});return Object.values(m).reduce((a,b)=>a+b,0)};
const discAll=()=>{const t=tot();if(!coupon||!t)return 0;const v=+coupon.value||0;return coupon.type==='percent'?Math.round(t*Math.min(100,v)/100):Math.min(t,Math.round(v))};
let tmpLoc=null;
const mapUrl=l=>`https://www.google.com/maps?q=${l.lat},${l.lng}`;
async function enableNotif(){
 try{
  if(!msg||!('Notification' in window))return alert('جهازك لا يدعم الإشعارات. على الآيفون ثبّت التطبيق من Safari أولاً');
  const p=await Notification.requestPermission();
  if(p!=='granted')return alert('لم يتم السماح بالإشعارات');
  const rg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  const tk=await msg.getToken({vapidKey:VAPID,serviceWorkerRegistration:rg});
  if(tk){localStorage.setItem('zpush','1');alert('✅ تم تفعيل الإشعارات');route(true)}
 }catch(e){console.error(e);alert('تعذر تفعيل الإشعارات')}
}
if(msg)try{msg.onMessage(async p=>{const n=p.notification||{};const rg=await navigator.serviceWorker.getRegistration();if(rg)rg.showNotification(n.title||'zainorder',{body:n.body||'',icon:'icon-192.png'})})}catch(e){}
const notifCard=()=>(msg&&!/^PASTE/.test(VAPID)&&typeof Notification!=='undefined'&&Notification.permission==='default')?`<div class="w"><div class="reo" style="margin-top:6px"><div><b>🔔 الإشعارات</b><br><small style="color:var(--g)">فعّلها لتصلك العروض والخصومات</small></div><button class="btn s" onclick="enableNotif()">تفعيل</button></div></div>`:'';
function reg(edit){
 const u=L('zuser',{});tmpLoc=u.loc||null;
 $('app').innerHTML=`<div class="w" style="padding-top:30px"><div style="text-align:center;font-size:52px">🍔</div><h2 style="text-align:center;margin-top:4px">${edit?'بياناتي':'أهلاً بك في zainorder'}</h2><p style="text-align:center;color:var(--g);margin-bottom:12px">${edit?'عدّل بياناتك ثم احفظ':'سجّل بياناتك مرة واحدة ليصلك طلبك بسرعة'}</p>
 <div class="box"><input id="rn" placeholder="الاسم الكامل" value="${esc(u.n)}"><input id="ra" type="number" inputmode="numeric" placeholder="العمر" value="${esc(u.age)}"><input id="rp" type="tel" placeholder="رقم الهاتف" value="${esc(u.t)}"><input id="rd" placeholder="العنوان (المدينة - الحي - الشارع)" value="${esc(u.a)}"></div>
 <button class="btn" onclick="saveReg(${edit})">${edit?'حفظ ✅':'دخول ✅'}</button>${edit?'<button class="btn" style="background:#999;margin-top:8px" onclick="go(\'\')">رجوع</button>':''}</div>`;
 chrome(edit?'profile':'reg');
}
function saveReg(edit){
 const n=$('rn').value.trim(),age=$('ra').value.trim(),t=$('rp').value.trim(),a=$('rd').value.trim();
 if(!n)return alert('اكتب اسمك');
 if(!(+age>=5&&+age<=120))return alert('اكتب عمرك بشكل صحيح');
 if(t.replace(/\D/g,'').length<8)return alert('اكتب رقم هاتف صحيح');
 if(!a)return alert('اكتب عنوانك');
 localStorage.setItem('zuser',JSON.stringify({n,age,t,a,loc:null}));
 localStorage.setItem('zinfo',JSON.stringify({n,t,a}));draft={};
 go('');
}
function saveDraft(){draft={n:$('n').value,t:$('t').value,a:$('a').value,o:$('o').value,pay:(document.querySelector('input[name=pay]:checked')||{}).value||'cash'}}
function pshow(){const e=document.querySelector('input[name=pay]:checked');if(e)$('shi').style.display=e.value==='sham'?'block':'none'}
async function applyCp(){
 const code=($('cp').value||'').trim().toUpperCase().replace(/\s/g,'');
 if(!code)return alert('اكتب كود الخصم');
 saveDraft();
 try{
  const sn=await db.collection('coupons').where('code','==',code).limit(1).get();
  if(sn.empty)return alert('الكود غير صحيح');
  const c=sn.docs[0].data();
  if(c.active===false)return alert('هذا الكود غير فعّال');
  coupon={code,type:c.type,value:+c.value||0};localStorage.setItem('zcoup',JSON.stringify(coupon));
  cartPage();
 }catch(e){console.error(e);alert('تعذر التحقق من الكود، تأكد من الإنترنت')}
}
function rmCp(){saveDraft();coupon=null;localStorage.removeItem('zcoup');cartPage()}
function cartPage(){
 const it=Object.entries(cart),info={...L('zinfo',{}),...draft};
 if(!it.length){$('app').innerHTML='<div class="w" style="padding-top:40px;text-align:center"><h2>🛒 السلة فارغة</h2><button class="btn" onclick="go(\'\')">تصفح المطاعم</button></div>';return chrome('cart')}
 const d=discAll(),f=feeTotal(),shams={};Object.values(cart).forEach(i=>{if(i.sham)shams[i.rest]=i.sham});
 const sh=Object.entries(shams).map(([r,x])=>`<div>🍽️ ${esc(r)}: <b>${esc(x)}</b></div>`).join('')||'<div>سيصلك رقم الحساب من المطعم على واتساب.</div>';
 $('app').innerHTML=`<div class="w" style="padding-top:14px"><h2>🛒 سلتك</h2><div class="box">${it.map(([id,i])=>`<div class="row"><span><b>${esc(i.name)}</b><br><small style="color:var(--g)">${esc(i.rest)} · ${i.price} × ${i.qty} = ${i.price*i.qty}</small></span><div class="q"><button onclick="add('${id}',1)">+</button><b>${i.qty}</b><button class="mn" onclick="add('${id}',-1)">−</button></div></div>`).join('')}
 <div class="row"><span>سعر المنتجات</span><b>${tot()} ل.س</b></div>${f?`<div class="row"><span>🛵 أجور التوصيل</span><b>${f} ل.س</b></div>`:''}${d?`<div class="row"><span>🎟️ الحسم</span><b style="color:#d33">−${d} ل.س</b></div>`:''}<div class="row"><b>المبلغ الكلي</b><b class="pc" style="font-size:20px">${tot()-d+f} ل.س</b></div></div>
 <div class="box"><b>🎟️ كود الخصم</b>${coupon?`<div class="row" style="border:0"><span><b>${esc(coupon.code)}</b> مُطبَّق</span><button onclick="rmCp()">✖ إلغاء</button></div>`:`<input id="cp" placeholder="اكتب الكود إن وُجد"><button class="btn s" style="width:100%;margin-top:4px" onclick="applyCp()">تطبيق الكود</button>`}</div>
 <div class="box"><b>💳 طريقة الدفع</b><label class="pay"><input type="radio" name="pay" value="cash" ${info.pay==='sham'?'':'checked'} onchange="pshow();saveDraft()">💵 كاش عند الاستلام</label><label class="pay"><input type="radio" name="pay" value="sham" ${info.pay==='sham'?'checked':''} onchange="pshow();saveDraft()">📱 شام كاش</label><div id="shi" style="display:none;margin-top:8px;font-size:14px;color:var(--g)">حوّل المبلغ إلى حساب شام كاش، ثم أرسل إيصال التحويل في واتساب:${sh}</div></div>
 <div class="box"><input id="n" oninput="saveDraft()" placeholder="الاسم" value="${esc(info.n)}"><input id="t" oninput="saveDraft()" type="tel" placeholder="رقم الهاتف" value="${esc(info.t)}"><input id="a" oninput="saveDraft()" placeholder="العنوان بالتفصيل" value="${esc(info.a)}"><textarea id="o" oninput="saveDraft()" rows="2" placeholder="ملاحظات">${esc(info.o)}</textarea></div>
 <button class="btn" onclick="send()">إرسال الطلب عبر واتساب ✅</button></div>`;
 pshow();chrome('cart');
}
const ex=()=>{const u=L('zuser',{});return u.age?`\n🎂 العمر: ${u.age}`:''};
const mp=()=>'';
const VER='v6';
let pend=[];
const waHref=(num,text)=>{const e=encodeURIComponent(text);return /Android|iPhone|iPad/i.test(navigator.userAgent)?`whatsapp://send?phone=${num}&text=${e}`:`https://wa.me/${num}?text=${e}`};
function copyOrder(i){
 const t=pend[i].text;
 const done=()=>alert('✅ تم نسخ الطلب، افتح واتساب والصقه وأرسله');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(()=>fb());else fb();
 function fb(){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(e){alert('تعذر النسخ')}x.remove()}
}
function showSend(links,title){
 pend=links;
 $('app').innerHTML=`<div class="w" style="padding-top:14px"><h2>${title}</h2><p style="color:var(--g)">اضغط الزر الأخضر لفتح واتساب وإرسال الرسالة. وإن لم يفتح فانسخ النص والصقه في واتساب.</p>`+links.map((l,i)=>`<div class="box"><b>🍽️ ${esc(l.rest)}</b><a class="ct" href="${waHref(l.num,l.text)}">💬 فتح واتساب وإرسال</a><button class="btn" style="background:#555" onclick="copyOrder(${i})">📋 نسخ نص الطلب</button><a href="https://wa.me/${l.num}?text=${encodeURIComponent(l.text)}" target="_blank" style="display:block;text-align:center;margin-top:10px;font-size:13px;color:var(--g)">لم يفتح؟ جرّب الرابط البديل</a></div>`).join('')+`<button class="btn" style="margin-top:10px" onclick="go('orders')">تم ✅</button><p style="text-align:center;color:#bbb;font-size:11px;margin-top:14px">${VER}</p></div>`;
 chrome('cart');scrollTo(0,0);
}
function waNum(n){let d=String(n||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='963'+d.slice(1);return d||WHATSAPP}
function quick(id){
 const p=P.find(x=>x.id===id);if(!p)return;
 const r=R.find(x=>x.id===p.rid)||{},i=L('zinfo',{}),f=+String(r.fee||'').replace(/[^\d.]/g,'')||0;
 const m=`🛍️ *طلب جديد - zainorder*\n\n🍽️ *${r.name||''}*\n• ${p.name} × 1 = ${p.price}\n\n💰 سعر المنتج: ${p.price} ل.س${f?`\n🛵 أجور التوصيل: ${f} ل.س`:''}\n✅ *المبلغ الكلي: ${+p.price+f} ل.س*\n💳 طريقة الدفع (كاش / شام كاش): \n\n👤 ${i.n||'الاسم: '}${ex()}\n📞 ${i.t||'الهاتف: '}\n📍 ${i.a||'العنوان: '}${mp()}`;
 showSend([{rest:r.name||'',num:waNum(r.wa),text:m}],'📨 طلبك جاهز');
}
function send(){
 const Z={...L('zinfo',{}),...L('zuser',{})};
 const n=$('n').value.trim()||Z.n||'',t=$('t').value.trim()||Z.t||'',a=$('a').value.trim()||Z.a||'',o=$('o').value.trim();
 if(!n){$('n').focus();return alert('الرجاء كتابة الاسم')}
 if(!t){$('t').focus();return alert('الرجاء كتابة رقم الهاتف')}
 if(!a){$('a').focus();return alert('الرجاء كتابة العنوان')}
 const pay=(document.querySelector('input[name=pay]:checked')||{}).value||'cash';
 localStorage.setItem('zinfo',JSON.stringify({n,t,a}));
 const total=tot(),d=discAll();
 const by={};Object.values(cart).forEach(i=>{const k=i.rid||i.rest;(by[k]=by[k]||{rest:i.rest,wa:i.wa,sham:i.sham,fee:+i.fee||0,items:[]}).items.push(i)});
 const links=Object.values(by).map(g=>{
  const sub=g.items.reduce((s,i)=>s+i.qty*i.price,0);
  const dg=!coupon||!d?0:(coupon.type==='percent'?Math.round(sub*Math.min(100,+coupon.value||0)/100):Math.round(d*sub/total));
  let m=`🛍️ *طلب جديد - zainorder*\n\n🍽️ *${g.rest}*\n`+g.items.map(i=>`• ${i.name} × ${i.qty} = ${i.qty*i.price}`).join('\n')+`\n\n💰 سعر المنتجات: ${sub} ل.س`;
  if(dg)m+=`\n🎟️ الحسم (${coupon.code}): −${dg} ل.س`;
  if(g.fee)m+=`\n🛵 أجور التوصيل: ${g.fee} ل.س`;
  m+=`\n✅ *المبلغ الكلي: ${sub-dg+(+g.fee||0)} ل.س*\n\n💳 *طريقة الدفع: ${pay==='sham'?'شام كاش':'كاش عند الاستلام'}*`;
  if(pay==='sham')m+=(g.sham?`\n📱 حساب شام كاش: ${g.sham}`:'')+`\n⚠️ سأرسل إيصال التحويل هنا`;
  m+=`\n\n👤 ${n}${ex()}\n📞 ${t}\n📍 ${a}${mp()}`+(o?`\n📝 ${o}`:'');
  return {rest:g.rest,num:waNum(g.wa),text:m};
 });
 const h=L('zhist',[]);h.unshift({date:Date.now(),total:total-d+feeTotal(),cart});localStorage.setItem('zhist',JSON.stringify(h.slice(0,20)));
 cart={};saveC();coupon=null;localStorage.removeItem('zcoup');draft={};
 showSend(links,'📨 طلبك جاهز');
}
function orders(){
 const h=L('zhist',[]);
 $('app').innerHTML=`<div class="w" style="padding-top:14px"><h2>🧾 طلباتي</h2>`+(h.map((o,i)=>`<div class="box"><b>${new Date(o.date).toLocaleString('ar')}</b><br><small style="color:var(--g)">${Object.values(o.cart).map(x=>esc(x.name)+' ×'+x.qty).join('، ')}</small><div class="row" style="border:0"><b>${o.total} ل.س</b><button class="btn s" onclick="reorder(${i})">إعادة الطلب</button></div></div>`).join('')||'<p style="color:var(--g)">لا توجد طلبات سابقة.</p>')+'</div>';
 chrome('orders');
}
function reorder(i){const o=L('zhist',[])[i];if(!o)return;cart=o.cart;saveC();go('cart')}

// ===== لوحة التحكم =====
const F={
 restaurants:{t:'مطعم',f:[['name','اسم المطعم'],['cat','التصنيف (مطاعم، سوبر ماركت، حلويات...)'],['desc','نوع الأكل (فروج، شاورما)'],['img','رابط صورة الغلاف'],['logo','رابط الشعار'],['time','مدة التوصيل مثل 20-35'],['fee','أجور التوصيل'],['wa','رقم واتساب المطعم (مثل 0934845767)','tel'],['sham','حساب شام كاش للمطعم (اختياري)'],['rating','التقييم مثل 4.5']]},
 products:{t:'منتج',f:[['rid','المطعم','sel'],['sec','القسم (وجبات، مشروبات...)'],['name','اسم المنتج'],['price','السعر','number'],['desc','وصف قصير'],['img','رابط الصورة']]},
 coupons:{t:'كود خصم',f:[['code','اسم الكود (مثل ZEIN10)'],['type','نوع الخصم','typ'],['value','قيمة الخصم (نسبة % أو مبلغ)','number']]},
 offers:{t:'عرض',f:[['title','عنوان العرض'],['text','تفاصيل'],['img','رابط صورة'],['rid','مطعم مرتبط (اختياري)','sel']]}
};
let ed={};
function form(c){
 const d=F[c];
 return `<div class="box"><h2 style="margin-top:0">${ed[c]?'تعديل':'إضافة'} ${d.t}</h2>`+d.f.map(([k,l,ty])=>ty==='typ'?`<select id="f_${c}_${k}"><option value="percent">نسبة مئوية %</option><option value="fixed">مبلغ ثابت (ل.س)</option></select>`:ty==='sel'?`<select id="f_${c}_${k}"><option value="">${l}</option>${R.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>`:`<input id="f_${c}_${k}" type="${ty||'text'}" placeholder="${l}">`+((k==='img'||k==='logo')?`<label class="up">📷 اختر صورة من الجوال<input type="file" accept="image/*" hidden onchange="pick(this,'${c}','${k}')"></label><img id="pv_${c}_${k}" style="display:none;width:90px;height:90px;object-fit:cover;border-radius:12px;margin:6px 0">`:'')).join('')+`<button class="btn" onclick="sv('${c}')">حفظ</button>${ed[c]?`<button class="btn" style="background:#999;margin-top:6px" onclick="ed['${c}']=null;admin()">إلغاء التعديل</button>`:''}</div>`;
}
function fill(c){const id=ed[c];if(!id)return;const x=({restaurants:R,products:P,offers:O,coupons:Cp})[c].find(z=>z.id===id)||{};F[c].f.forEach(([k])=>{const e=$(`f_${c}_${k}`);if(e)e.value=x[k]??'';const pv=$(`pv_${c}_${k}`);if(pv&&x[k]){pv.src=x[k];pv.style.display='block'}})}
function admin(){
 const u=auth.currentUser;
 if(!u){$('app').innerHTML=`<div class="w" style="padding-top:30px"><h2>دخول المالك</h2><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة السر"><button class="btn" onclick="login()">دخول</button><p id="err" style="color:red"></p></div>`;return chrome('admin')}
 $('app').innerHTML=`<div class="w" style="padding-top:14px"><button class="btn s" onclick="go('')">→ الموقع</button> <button class="btn s" style="background:#999" onclick="auth.signOut()">خروج</button>
 ${form('restaurants')}${form('products')}${form('offers')}${form('coupons')}
 <div class="box"><h2 style="margin-top:0">المطاعم والمنتجات</h2>`+R.map(r=>`<div class="row"><b>${esc(r.name)}</b><span><button onclick="tg('restaurants','${r.id}','open',${r.open!==false})">${r.open!==false?'إغلاق':'فتح'}</button><button onclick="edt('restaurants','${r.id}')">✏️</button><button onclick="del('restaurants','${r.id}')">🗑️</button></span></div>`+P.filter(p=>p.rid===r.id).map(p=>`<div class="row"><span>&nbsp;&nbsp;${esc(p.name)} - ${esc(p.price)}</span><span><button onclick="tg('products','${p.id}','available',${p.available!==false})">${p.available!==false?'إخفاء':'إظهار'}</button><button onclick="edt('products','${p.id}')">✏️</button><button onclick="del('products','${p.id}')">🗑️</button></span></div>`).join('')).join('')+`</div>
 <div class="box"><h2 style="margin-top:0">أكواد الخصم</h2>${Cp.map(c=>`<div class="row"><span>🎟️ <b>${esc(c.code)}</b> — ${c.type==='percent'?esc(c.value)+'%':esc(c.value)+' ل.س'}</span><span><button onclick="tg('coupons','${c.id}','active',${c.active!==false})">${c.active!==false?'إيقاف':'تفعيل'}</button><button onclick="edt('coupons','${c.id}')">✏️</button><button onclick="del('coupons','${c.id}')">🗑️</button></span></div>`).join('')||'لا يوجد'}</div>
 <div class="box"><h2 style="margin-top:0">العروض</h2>${O.map(o=>`<div class="row"><span>${esc(o.title)}</span><span><button onclick="edt('offers','${o.id}')">✏️</button><button onclick="del('offers','${o.id}')">🗑️</button></span></div>`).join('')||'لا يوجد'}</div></div>`;
 Object.keys(F).forEach(fill);chrome('admin');
 if(!cpOk){cpOk=true;db.collection('coupons').get().then(sn=>{Cp=sn.docs.map(d=>({id:d.id,...d.data()}));if(cur==='admin')admin()}).catch(e=>console.error(e))}
}
async function login(){try{await auth.signInWithEmailAndPassword($('em').value,$('pw').value)}catch(e){$('err').textContent='بيانات الدخول غير صحيحة'}}
async function sv(c){
 const o={};F[c].f.forEach(([k,,ty])=>{const v=$(`f_${c}_${k}`).value.trim();o[k]=ty==='number'?+v||0:v});
 if(c==='coupons'){o.code=o.code.toUpperCase().replace(/\s/g,'');if(!o.code||!o.value)return alert('أدخل اسم الكود وقيمة الخصم')}
 if(!o[(F[c].f.find(x=>x[0]==='name'||x[0]==='title')||F[c].f[0])[0]])return alert('أدخل الاسم/العنوان');
 if(c==='products'&&!o.rid)return alert('اختر المطعم');
 if(ed[c])await db.collection(c).doc(ed[c]).update(o);else{if(c==='products')o.available=true;if(c==='restaurants')o.open=true;if(c==='coupons')o.active=true;await db.collection(c).add(o)}
 ed[c]=null;await load();admin();
}
function pick(el,c,k){
 const f=el.files[0];if(!f)return;
 const max=k==='logo'?200:(c==='products'?360:800);
 const rd=new FileReader();
 rd.onload=e=>{const im=new Image();im.onload=()=>{
  const sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  const d=cv.toDataURL('image/jpeg',0.72);
  $(`f_${c}_${k}`).value=d;const pv=$(`pv_${c}_${k}`);pv.src=d;pv.style.display='block';
 };im.onerror=()=>alert('تعذر قراءة الصورة');im.src=e.target.result};
 rd.readAsDataURL(f);
}
function edt(c,id){ed[c]=id;admin();scrollTo(0,0)}
async function del(c,id){if(!confirm('تأكيد الحذف؟'))return;if(c==='restaurants')for(const p of P.filter(p=>p.rid===id))await db.collection('products').doc(p.id).delete();await db.collection(c).doc(id).delete();await load();admin()}
async function tg(c,id,k,cur){await db.collection(c).doc(id).update({[k]:!cur});await load();admin()}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function retry(){err=false;route(true);Promise.race([load(),new Promise((_,j)=>setTimeout(()=>j('timeout'),25000))]).then(()=>route(true)).catch(e=>{console.error(e);err=true;route(true)})}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==cur){prev=cur;cur=h;route()}});
if(auth)auth.onAuthStateChanged(()=>{if(cur==='admin')route(true)});
route();
Promise.race([load(),new Promise((_,j)=>setTimeout(()=>j('timeout'),25000))]).then(()=>{if(cur==='admin'&&[...document.querySelectorAll('#app input,#app select')].some(i=>i.value))return;route(true)}).catch(e=>{console.error(e);err=true;route(true)});
</script>
